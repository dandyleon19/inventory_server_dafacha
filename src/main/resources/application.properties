spring.application.name=inventory-server-dafacha

# Fixed local port (salonspa_server_v2 uses 8080)
server.port=8081

# R2DBC — reactive runtime (override with DB_URL, DB_USERNAME, DB_PASSWORD)
spring.r2dbc.url=${DB_URL:r2dbc:postgresql://localhost:5432/inventory_dafacha}
spring.r2dbc.username=${DB_USERNAME:postgres}
spring.r2dbc.password=${DB_PASSWORD:root}

# JDBC — Flyway migrations only (override with JDBC_URL)
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/inventory_dafacha}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Spring SQL init; schema is managed by Flyway
spring.sql.init.mode=never

# Flyway — needs explicit JDBC URL when using R2DBC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${JDBC_URL:jdbc:postgresql://localhost:5432/inventory_dafacha}
spring.flyway.user=${DB_USERNAME:postgres}
spring.flyway.password=${DB_PASSWORD:root}

# JWT — override with JWT_SECRET, JWT_EXPIRATION_MS (default secret is for local dev only)
app.jwt.secret=${JWT_SECRET:dev-only-secret-dev-only-secret-dev-only}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# CORS — comma-separated browser origins (see CORS_ALLOWED_ORIGINS in .env)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}

logging.level.org.springframework.r2dbc=${R2DBC_LOG_LEVEL:INFO}
